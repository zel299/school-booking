<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Tech Cafe - Services</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header>
    <div class="header-container">
      <a href="/index.html" class="site-title">⚙️ IT Service Hub</a>
      <nav>
        <a href="/index.html" class="active">Services</a>
        <a href="/book.html">Book Now</a>
        <a href="/status.html">Track Status</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-header">
      <h1 class="page-title">Available Services</h1>
      <p class="page-subtitle">Select a service or rental option to create your reservation.</p>
    </div>

    <div id="banner" class="banner hidden"></div>

    <div id="loading-state" class="state-box">
      <p>Loading available services...</p>
    </div>

    <div id="empty-state" class="state-box hidden">
      <p>No active services available right now. Please check back later.</p>
    </div>

    <div id="services-grid" class="services-grid hidden"></div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const servicesGrid = document.getElementById("services-grid");
      const loadingState = document.getElementById("loading-state");
      const emptyState = document.getElementById("empty-state");
      const banner = document.getElementById("banner");

      function formatPeso(amount) {
        return "₱" + parseFloat(amount).toLocaleString("en-PH", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });
      }

      try {
        const res = await fetch("/api/services");
        if (!res.ok) throw new Error("Failed to load services.");
        
        const services = await res.json();
        loadingState.classList.add("hidden");

        if (!services || services.length === 0) {
          emptyState.classList.remove("hidden");
          return;
        }

        servicesGrid.innerHTML = "";
        services.forEach(service => {
          const card = document.createElement("div");
          card.className = "service-card";
          card.innerHTML = `
            <div>
              <h2 class="service-title">${service.name}</h2>
              <p class="service-desc">${service.description}</p>
            </div>
            <div>
              <div class="service-price">${formatPeso(service.price)}</div>
              <a href="/book.html?service=${service.id}" class="btn btn-primary">Book now</a>
            </div>
          `;
          servicesGrid.appendChild(card);
        });

        servicesGrid.classList.remove("hidden");
      } catch (err) {
        loadingState.classList.add("hidden");
        banner.textContent = err.message || "An error occurred loading services.";
        banner.className = "banner banner-error";
        banner.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
